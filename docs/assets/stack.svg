<text x="40" y="50" class="dg-h">Your Mac</text>
<text x="600" y="50" class="dg-sub" text-anchor="end">Apple silicon, user processes</text>
<text x="660" y="160" class="dg-h">Pod</text>
<text x="960" y="160" class="dg-sub" text-anchor="end">one microVM per pod, own kernel</text>
<text x="54" y="95" class="dg-b">Control plane</text>
<text x="54" y="115" class="dg-mono">kube-apiserver, etcd</text>
<text x="54" y="132" class="dg-mono">kube-scheduler</text>
<text x="54" y="149" class="dg-mono">kube-controller-manager</text>
<text x="54" y="170" class="dg-sub">upstream binaries, darwin/arm64</text>
<text x="354" y="95" class="dg-mono dg-b">briglet node</text>
<text x="354" y="116" class="dg-sub">the node agent, client-go</text>
<text x="354" y="134" class="dg-sub">watches Pods, Services, slices</text>
<text x="354" y="152" class="dg-sub">logs and exec on :10250</text>
<text x="354" y="170" class="dg-sub">one hull run per pod</text>
<text x="482" y="207" class="dg-sub dg-dim">Service table</text>
<text x="196" y="199" class="dg-sub dg-dim">hull run</text>
<text x="54" y="255" class="dg-mono dg-b">hull</text>
<text x="54" y="276" class="dg-sub">pulls images, shares rootfs and</text>
<text x="54" y="294" class="dg-sub">pod dir, runs and stops the VM</text>
<text x="354" y="255" class="dg-b">Network gateway</text>
<text x="354" y="276" class="dg-sub">pod network, DNS, egress</text>
<text x="354" y="294" class="dg-sub">VIP → endpoints, NodePorts</text>
<text x="354" y="332" class="dg-sub dg-dim">each pod VM's eth0, over a Unix socket</text>
<text x="54" y="371" class="dg-mono dg-b">hvi</text>
<text x="54" y="390" class="dg-sub">RAM, vCPUs, virtio devices</text>
<text x="54" y="408" class="dg-sub">Seatbelt: deny by default</text>
<text x="475" y="373" class="dg-sub dg-dim" text-anchor="middle">virtio: fs, net, vsock</text>
<text x="54" y="476" class="dg-b">Hypervisor.framework</text>
<text x="54" y="492" class="dg-sub">vCPUs and guest memory, in macOS</text>
<text x="674" y="203" class="dg-b">containers</text>
<text x="674" y="221" class="dg-sub">overlay of the image, own namespaces</text>
<text x="674" y="279" class="dg-mono dg-b">briglet-guest</text>
<text x="674" y="297" class="dg-sub">supervisor: run, restart, logs, exec</text>
<text x="674" y="355" class="dg-b">Linux kernel</text>
<text x="674" y="373" class="dg-sub">virtio-mmio drivers, no PCI</text>
<text x="640" y="502" class="dg-sub">A container restart keeps the VM, its</text>
<text x="640" y="520" class="dg-sub">kernel and its address. Status and logs</text>
<text x="640" y="538" class="dg-sub">come back over the shared pod directory,</text>
<text x="640" y="556" class="dg-sub">never from a process inside the VM.</text>
</svg>
